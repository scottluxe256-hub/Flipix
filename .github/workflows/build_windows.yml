name: Build Flutter Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      CL: "/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Windows Executable
        run: flutter build windows --release

      - name: Create Single EXE Installer
        run: |
          echo "[Setup]" > setup.iss
          echo "AppName=Flip Card Game" >> setup.iss
          echo "AppVersion=1.0" >> setup.iss
          echo "DefaultDirName={autopf}\FlipCardGame" >> setup.iss
          echo "OutputDir=Output" >> setup.iss
          echo "OutputBaseFilename=Setup_FlipCardGame" >> setup.iss
          echo "Compression=lzma2" >> setup.iss
          echo "SolidCompression=yes" >> setup.iss
          echo "PrivilegesRequired=lowest" >> setup.iss
          echo "SetupIconFile=windows\runner\resources\app_icon.ico" >> setup.iss
          echo "[Files]" >> setup.iss
          echo "Source: ""build\windows\x64\runner\Release\*""; DestDir: ""{app}""; Flags: ignoreversion recursesubdirs createallsubdirs" >> setup.iss
          echo "[Icons]" >> setup.iss
          echo "Name: ""{autodesktop}\Flip Card Game""; Filename: ""{app}\flip_card_game.exe""" >> setup.iss
          iscc setup.iss

      - name: Upload Single EXE Installer
        uses: actions/upload-artifact@v4
        with:
          name: FlipCardGame-Installer
          path: Output/Setup_FlipCardGame.exe