name: FlipFix Build

on:
  push:
    branches:
      - main
      - master

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ==========================================
  # ANDROID APK
  # ==========================================
  android:
    name: Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Check Gradle
        run: gradle --version

      - name: Build debug APK
        run: |
          gradle :androidApp:assembleDebug --no-daemon

      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p release

          APK=$(find androidApp/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK was not produced."
            echo "Searching build directory..."
            find androidApp/build -type f -name "*.apk" || true
            exit 1
          fi

          echo "APK found: $APK"
          cp "$APK" release/FlipFix.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FlipFix-Android
          path: release/FlipFix.apk
          if-no-files-found: error

  # ==========================================
  # WINDOWS EXE
  # ==========================================
  windows:
    name: Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Check Gradle
        shell: pwsh
        run: gradle --version

      - name: Build Windows EXE
        shell: pwsh
        run: |
          gradle :desktopApp:packageReleaseExe --no-daemon

      - name: Locate EXE
        shell: pwsh
        run: |
          $exe = Get-ChildItem `
            -Path "desktopApp/build/compose/binaries" `
            -Filter "*.exe" `
            -Recurse `
            -ErrorAction SilentlyContinue `
            | Select-Object -First 1

          if (-not $exe) {
            Write-Host "EXE was not produced."
            Write-Host "Searching build directory..."
            Get-ChildItem `
              -Path "desktopApp/build" `
              -Filter "*.exe" `
              -Recurse `
              -ErrorAction SilentlyContinue

            exit 1
          }

          Write-Host "EXE found: $($exe.FullName)"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "release" `
            | Out-Null

          Copy-Item `
            $exe.FullName `
            "release/FlipFix.exe" `
            -Force

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: FlipFix-Windows
          path: release/FlipFix.exe
          if-no-files-found: error