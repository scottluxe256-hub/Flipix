name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-apk:
    name: Build FlipFix APK (aarch64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "ndk;25.2.9519653" "build-tools;34.0.0" "platforms;android-34"

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-apk
        run: cargo install cargo-apk

      - name: Build APK via cargo-apk
        env:
          ANDROID_NDK_HOME: ${{ runner.workspace }}/../android-sdk/ndk/25.2.9519653
        run: cargo apk build --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlipFix-Release-APK
          path: target/debug/apk/flipfix.apk
