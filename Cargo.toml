[package]
name = "flipfix"
version = "0.1.0"
edition = "2021"
authors = ["Your Name"]
description = "FlipFix - Pure Rust Memory Match Game for Android"

[lib]
name = "flipfix"
path = "src/main.rs"
crate-type = ["cdylib"]

[dependencies]
# Game Engine 2D
macroquad = "0.4"

# Image Processing (WebP & PNG)
image = "0.24"

# Audio Decoder & Stream Engine (Symphonia v0.5 features)
symphonia = { version = "0.5", features = ["aac", "isomp4", "ogg"] }
rodio = { version = "0.17", default-features = false }

# Video AV1 Decoder
dav1d = "0.9"

# Target spesifik untuk kompilasi Android NDK / Cargo-APK
[package.metadata.android]
package = "com.flipfix.game"
label = "FlipFix"
icon = "assets/logo.png"
assets = "assets"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 28
target_sdk_version = 34
